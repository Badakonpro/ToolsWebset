# 将此文件放到 ai-translate-dub 仓库的 .github/workflows/ 目录下
# 文件名：trigger-site-rebuild.yml
#
# 效果：每次发布新 Release，自动触发 lingyuetools.org 重新构建部署
#
# 步骤：
# 1. 在 ToolsWebset 仓库 → Settings → Secrets → Actions → New secret
#    名称：SITE_DEPLOY_TOKEN，值：一个有 workflow 权限的 GitHub Personal Access Token
# 2. 把此文件放到 ai-translate-dub 仓库的 .github/workflows/trigger-site-rebuild.yml

name: Trigger site rebuild on release

on:
  release:
    types: [published]

jobs:
  rebuild-site:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ToolsWebset deploy workflow
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.SITE_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Badakonpro/ToolsWebset/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Deploy triggered for release ${{ github.event.release.tag_name }}"
